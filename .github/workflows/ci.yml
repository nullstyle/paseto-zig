name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MISE_ZIG_USE_COMMUNITY_MIRRORS: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Zig test suite (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04-arm
          - ubuntu-latest
          - macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig and Binaryen
        uses: jdx/mise-action@v3
        with:
          cache: true
          install_args: zig aqua:WebAssembly/binaryen deno

      - name: Show Zig version
        run: |
          zig version
          wasm-opt --version

      - name: Check formatting
        run: zig fmt --check build.zig src tests

      - name: Release hygiene (zon/README/tag agreement)
        run: tools/release-check.sh "$GITHUB_REF_NAME"

      - name: Run unit tests
        run: zig build unit

      - name: Run end-to-end tests
        run: zig build e2e

      - name: Run example programs
        run: zig build examples

      - name: Test WASM ABI
        run: zig build wasm-test

      - name: Build ReleaseSafe WASM
        run: zig build wasm

      - name: Run Deno WASM engine smoke
        run: deno run --allow-read=zig-out tests/wasm/deno_smoke.ts

      - name: Run vector tests
        run: zig build vectors

      - name: Run cross-implementation interop fixtures
        run: zig build interop

      - name: Run deterministic fuzz corpus
        run: zig build fuzz-all

      - name: Run downstream consumer smoke
        working-directory: tests/consumer
        run: zig build

  # Non-gating canary against one pinned Zig development snapshot. Downstream
  # consumers build the tarball with dev toolchains, so trunk churn that breaks
  # the dev build (e.g. std API renames) should surface here first. The pin is
  # deliberate: bump it after re-running the full matrix. Dev-snapshot `zig
  # fmt` output is NOT authoritative — the stable toolchain owns formatting.
  dev-toolchain:
    name: Zig dev snapshot canary (non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Zig dev snapshot
        uses: jdx/mise-action@v3
        with:
          cache: true
          install_args: "zig@0.17.0-dev.1786+75044cb04"

      - name: Unit tests (dev snapshot)
        run: mise exec zig@0.17.0-dev.1786+75044cb04 -- zig build unit

      - name: End-to-end tests (dev snapshot)
        run: mise exec zig@0.17.0-dev.1786+75044cb04 -- zig build e2e

      - name: WASM ABI tests (dev snapshot)
        run: mise exec zig@0.17.0-dev.1786+75044cb04 -- zig build wasm-test
