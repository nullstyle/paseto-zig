[tools]
act = "latest"
zig = "0.16.0"
"aqua:WebAssembly/binaryen" = "130"
deno = "2.9.5"

[tasks.ci]
description = "Run the same checks as GitHub CI without Docker"
run = [
  "zig fmt --check build.zig src tests",
  "tools/release-check.sh",
  "zig build unit",
  "zig build e2e",
  "zig build wasm-test",
  "zig build wasm",
  "deno run --allow-read=zig-out tests/wasm/deno_smoke.ts",
  "zig build vectors",
  "zig build interop",
  "zig build fuzz-all",
  "cd tests/consumer && zig build",
]

[tasks.wasm]
description = "Build the ReleaseSafe freestanding WASM module"
run = "zig build wasm"

[tasks.wasm-test]
description = "Run focused packed WASM ABI tests"
run = "zig build wasm-test"

[tasks.release-check]
description = "Verify README tag and zon version agree (and match the ref on tag builds)"
run = "tools/release-check.sh"

[tasks.wasm-smoke]
description = "Run the Deno engine smoke test against the shipped WASM artifact"
run = "deno run --allow-read=zig-out tests/wasm/deno_smoke.ts"

[tasks.act-ci]
description = "Run the GitHub Actions CI workflow locally with act"
run = "act -j test"

[tasks.act-ci-dry-run]
description = "Preview the GitHub Actions CI workflow locally with act"
run = "act -n -j test"
