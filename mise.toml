[tools]
act = "latest"
zig = "0.16.0"
"aqua:WebAssembly/binaryen" = "130"

[tasks.ci]
description = "Run the same checks as GitHub CI without Docker"
run = [
  "zig fetch .",
  "zig fmt --check build.zig src tests",
  "zig build unit",
  "zig build e2e",
  "zig build vectors",
  "zig build fuzz-all",
]

[tasks.wasm]
description = "Build the ReleaseSafe freestanding WASM module"
run = "zig build wasm"

[tasks.wasm-test]
description = "Run focused packed WASM ABI tests"
run = "zig build wasm-test"

[tasks.act-ci]
description = "Run the GitHub Actions CI workflow locally with act"
run = "act -j test"

[tasks.act-ci-dry-run]
description = "Preview the GitHub Actions CI workflow locally with act"
run = "act -n -j test"
